[project]
name = "oj-py-hw2"
version = "0.1.0"
description = "Python course online judge project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt",
    "fastapi",
    "httpx",
    "pillow",
    "pypdf",
    "psutil",
    "python-dotenv",
    "pyyaml",
    "streamlit",
    "uvicorn",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '/(docs|codex-workflow)/'
